name: ML CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-train-evaluate:
    name: Train, Test & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code with flake8
        run: flake8 src/ tests/ --max-line-length=100

      - name: Run unit & data validation tests
        run: pytest tests/ -v

      - name: Train model
        run: python src/train.py --max-depth 6 --n-estimators 50

      - name: Evaluate model quality gate
        run: python src/evaluate.py --min-accuracy 0.92 --min-f1 0.92

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-ml-model
          path: |
            artifacts/model.pkl
            artifacts/metrics.json
          retention-days: 7

